[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "v1_depth_map"
dynamic = ["version"]
description = "Analysis for V1 depth map project"
license = { text = "MIT" }
authors = [
    { name = "Antonin Blot" },
    { name = "Yiran He", email = "yiran.he@crick.ac.uk" },
    { name = "Antonio Colas Nieto" },
    { name = "Caroline Cypranowska" },
    { name = "Petr Znamenskiy" },
]
urls = { Homepage = "https://github.com/znamlab/v1_depth_map" }
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas<3",
    "seaborn",
    "matplotlib==3.9.2",
    "scipy",
    "tables",
    "scikit-learn",
    "tqdm",
    "scikit-image",
    "defopt",
    "roifile",
    "pyarrow",
    "fastparquet",
    "opencv-python",
    "wayla @ git+https://github.com/znamlab/wayla.git@3673a8c5017362e2efd386a228c0b63a82fce7b9",
    "flexiznam @ git+https://github.com/znamlab/flexiznam.git@8f89b6b2bc241d1eb887c5d3f4b86e7d5ffad209",
    "znamutils @ git+https://github.com/znamlab/znamutils.git@3a205a96f936636fc252226610c2f5c75644bd7f",
    # cottage_analysis tag v1_depth_map_resubmission
    "cottage_analysis @ git+https://github.com/znamlab/cottage_analysis.git@c5785063191e1cdab33d2b3293046a464bb4c398",
    "pyparsing<3.0.0",
    "cmcrameri>=1.10",
    "pypdf>=6.21.2",
    "statsmodels>=0.15.0",
]

[project.optional-dependencies]
figure = [
    "jupyter",
    "notebook",
    "ipykernel",
    "black",
    "plotly",
    "kaleido",
]


[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools_scm]
# Write version to _version.py so it's importable at runtime
version_file = "v1_depth_map/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
# Only version tags (vX.Y.Z) define the version; other tags, such as the one marking the
# code of a paper, are ignored.
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*.[0-9]*"]

[tool.uv]
# The lab packages list each other by SSH URL; these pins make every one of them install over
# https, at the commit used for the paper.
override-dependencies = [
    "flexiznam @ git+https://github.com/znamlab/flexiznam.git@8f89b6b2bc241d1eb887c5d3f4b86e7d5ffad209",
    "flexilims @ git+https://github.com/znamlab/flexilims.git@ca19bb7794468c0cf1341402cd3648fe535f1807",
    "znamutils @ git+https://github.com/znamlab/znamutils.git@3a205a96f936636fc252226610c2f5c75644bd7f",
    "image-tools @ git+https://github.com/znamlab/image-tools.git@711b4ec8df5ba08ff0d71d526de32b7daf344943",
    "pymcms @ git+https://github.com/znamlab/pymcms.git@b835fa603d2cba105add49d2a6f0d3441857bb0c",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
